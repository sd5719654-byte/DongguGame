<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#082e27">
  <meta name="description" content="동구게임 - 친구 4명과 함께 즐기는 카드 벌칙 게임">
  <title>동구게임 · DONGGU GAME</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app" aria-live="polite"></div>
  <div class="rotate-hint" aria-hidden="true">
    <div class="phone-icon">↻</div>
    <strong>가로로 돌려주세요</strong>
    <span>동구게임은 가로 화면에서 즐길 수 있어요.</span>
  </div>
  <script src="app.js" defer></script>
  <script>
    if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
      window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
    }
  </script>
</body>
</html>
